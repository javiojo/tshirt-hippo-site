<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Shirt Hippo – Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f4ee;
      background-image:
        radial-gradient(circle at 20% 20%, #ffe8b0 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, #e8d5ff 0%, transparent 50%),
        radial-gradient(circle at 60% 10%, #ffd6e0 0%, transparent 40%);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* Floating dots bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, #c8a8e9 1.5px, transparent 1.5px),
        radial-gradient(circle, #f4c842 1.5px, transparent 1.5px);
      background-size: 60px 60px, 90px 90px;
      background-position: 0 0, 30px 30px;
      opacity: 0.18;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: min(420px, 85vw);
      animation: floatBounce 3.5s ease-in-out infinite;
      filter: drop-shadow(0 12px 32px rgba(120, 60, 200, 0.22));
    }

    @keyframes floatBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    .tagline {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      color: #7c3fbf;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: -0.5rem;
    }

    .coming-soon {
      margin-top: 1.5rem;
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 900;
      color: #f4a800;
      text-shadow:
        3px 3px 0 #c97e00,
        -1px -1px 0 #c97e00,
        1px -1px 0 #c97e00,
        -1px 1px 0 #c97e00;
      letter-spacing: -0.01em;
      line-height: 1;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .subtitle {
      margin-top: 1rem;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 700;
      color: #5a3a8a;
      opacity: 0.85;
    }

    .dots {
      margin-top: 2rem;
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: #f4a800; animation-delay: 0s; }
    .dot:nth-child(2) { background: #7c3fbf; animation-delay: 0.2s; }
    .dot:nth-child(3) { background: #f4a800; animation-delay: 0.4s; }
    .dot:nth-child(4) { background: #7c3fbf; animation-delay: 0.6s; }
    .dot:nth-child(5) { background: #f4a800; animation-delay: 0.8s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    footer {
      position: fixed;
      bottom: 1.2rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #9a7abf;
      letter-spacing: 0.05em;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="T-Shirt Hippo logo" class="logo" />
    <p class="tagline">Tees so cool, even hippos wear them</p>
    <h1 class="coming-soon">Coming Soon!</h1>
    <p class="subtitle">Something awesome is on its way&nbsp;🦛</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <footer>tshirthippo.com</footer>
</body>
</html>
